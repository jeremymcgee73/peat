[package]
name = "m5stack-core2-peat"
version = "0.1.0"
edition = "2021"
authors = ["Defense Unicorns"]
license = "Apache-2.0"
description = "Peat Protocol demonstration on M5Stack Core2 (ESP32)"
repository = "https://github.com/defenseunicorns/peat"

[dependencies]
# ESP-IDF HAL and services
esp-idf-svc = { version = "0.50", default-features = false, features = [
    "std",
    "binstart",
    "native"
] }
esp-idf-hal = "0.45"

# Logging
log = "0.4"

# Error handling
anyhow = "1.0"

# Base64 — for decoding the shared mesh genesis blob
base64 = "0.22"

# Display
display-interface-spi = "0.5"
mipidsi = "0.8"
embedded-graphics = "0.8"

# Peat libraries (registry). Pinned to =0.3.4-rc.2 — the rc.2 surface
# this firmware depends on:
#   * `update_peripheral_state` location-preservation fix (rc.1+).
#   * Relaxed `HealthStatus::decode` activity validator (rc.1+) —
#     lets `activity=4` (Prone) round-trip on the legacy peripheral
#     path instead of dropping the entire peripheral, the
#     `activity=4 + alerts=ALERT_MAN_DOWN` Prone wire encoding this
#     firmware emits.
#   * `update_alerts(alerts: u8)` API (rc.1+) used by the
#     periodic-debounced alerts write.
#   * `translator-codec` Cargo feature (rc.2) — exposes the
#     BleTranslator codec types (`BlePeripheral`,
#     `BleHealthStatus`, etc.) and the slim
#     `publish_platform_advertisement` API without pulling
#     peat-mesh / tokio / signal-hook (none of which build for
#     xtensa-esp32). The `esp32` feature pulls `translator-codec`
#     transitively, so the firmware gets the codec without an
#     explicit feature opt-in.
# Exact-version pin (`=`) so a future rc.x release doesn't auto-pull
# under `cargo update`; the bump is deliberate and tied to the
# downstream rebuild.
peat-btle = { version = "=0.3.4-rc.2", default-features = false, features = ["esp32"] }

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
debug = false
lto = true

[profile.dev]
debug = true
opt-level = "z"
