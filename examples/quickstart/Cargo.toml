[package]
name = "peat-quickstart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Smallest runnable Peat node — for the QUICKSTART walkthrough"

[[bin]]
name = "peat-quickstart"
path = "src/main.rs"

[dependencies]
peat-protocol = { path = "../../peat-protocol", default-features = false, features = ["automerge-backend"] }
peat-schema = { path = "../../peat-schema" }
# mDNS discovery moved to peat-mesh under peat#898 — the previous
# `peat_protocol::discovery::peer::MdnsDiscovery` was a duplicate of
# `peat_mesh::discovery::MdnsDiscovery` and violated the transport-
# agnosticism rule in `peat/SKILL.md`. Resolved via the workspace
# `[patch.crates-io]` to the in-flight peat-mesh PR until release.
peat-mesh = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"
