name: Release

# Tag-triggered release pipeline for the peat workspace.
#
# On push of a `v*` tag, this workflow:
#   1. Reuses the regular CI gates (format, clippy, tests, feature builds).
#   2. Verifies the tag version matches `[workspace.package].version` in Cargo.toml.
#   3. Publishes `peat-schema`, `peat-protocol`, independently versioned
#      `peat-ffi`, and `peat` to crates.io in dependency order.
#   4. Verifies the downloaded crate archives against sparse-index checksums.
#   5. Creates a GitHub release from the CHANGELOG.md entry plus checksums.
#
# Prerequisites:
#   - `CARGO_REGISTRY_TOKEN` repository secret with publish-new-crates scope.
#
# See `docs/RELEASING.md` for the end-to-end release process this workflow
# automates.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the rationale — mold pin moved out of .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Secrets do not propagate to reusable workflows automatically. The called
    # CI workflow's test and test-e2e jobs consume PEAT_APP_ID / PEAT_SHARED_KEY,
    # so we inherit the caller's full secret set.
    secrets: inherit

  validate-tag:
    name: Validate tag matches workspace version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare tag vs workspace.package.version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "peat-protocol") | .version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match workspace version $VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches workspace version $VERSION"

  publish:
    name: Publish to crates.io
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        # Match ci.yml — `.cargo/config.toml` forces `-fuse-ld=mold` for the
        # x86_64-unknown-linux-gnu target, so `cargo publish`'s verify step
        # needs mold, clang, and the dbus headers (pulled transitively by
        # some BLE-adjacent deps) to link.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      # Each publish step is idempotent: if the version is already on the
      # crates.io sparse index (what cargo itself reads), the publish is
      # skipped. This lets us re-run the job safely after any intermediate
      # failure without hitting "crate already uploaded" errors.
      #
      # The sparse index (index.crates.io) is preferred over the v1 API
      # because it is what cargo uses during dependency resolution, so
      # appearance on the sparse index is the authoritative "fully
      # published" signal. The v1 API sits behind a longer-lived CDN cache
      # that can mask a fresh publish for minutes.
      - name: Publish peat-schema (idempotent) and wait for index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat-schema"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v and .yanked == false)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat-schema $VERSION already on crates.io, skipping publish"
          else
            (cd peat-schema && cargo publish)
            for i in $(seq 1 60); do
              if is_indexed; then
                echo "peat-schema $VERSION is indexed after $((i * 5))s"
                exit 0
              fi
              echo "Waiting for peat-schema $VERSION to be indexed... ($((i * 5))s elapsed)"
              sleep 5
            done
            echo "::error::peat-schema $VERSION did not appear on the crates.io sparse index within 5 minutes"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish peat-protocol (idempotent) and wait for index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat-protocol"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v and .yanked == false)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat-protocol $VERSION already on crates.io, skipping publish"
            exit 0
          fi

          (cd peat-protocol && cargo publish)
          for i in $(seq 1 60); do
            if is_indexed; then
              echo "peat-protocol $VERSION is indexed after $((i * 5))s"
              exit 0
            fi
            echo "Waiting for peat-protocol $VERSION to be indexed... ($((i * 5))s elapsed)"
            sleep 5
          done
          echo "::error::peat-protocol $VERSION did not appear on the crates.io sparse index within 5 minutes"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # peat-ffi carries an INDEPENDENT version (0.2.x), not the workspace/tag
      # version, so the version is read from peat-ffi/Cargo.toml rather than
      # $GITHUB_REF_NAME. It depends on peat-protocol (and peat-mesh/peat-btle
      # via features), so it publishes after peat-protocol.
      - name: Publish peat-ffi (independent version, idempotent)
        run: |
          set -euo pipefail
          UA="peat-release (github.com/defenseunicorns/peat)"
          FFI_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "peat-ffi") | .version')
          echo "peat-ffi version: $FFI_VERSION"
          INDEX_URL="https://index.crates.io/pe/at/peat-ffi"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$FFI_VERSION" 'select(.vers == $v and .yanked == false)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat-ffi $FFI_VERSION already on crates.io, skipping publish"
            exit 0
          fi

          (cd peat-ffi && cargo publish)
          for i in $(seq 1 60); do
            if is_indexed; then
              echo "peat-ffi $FFI_VERSION is indexed after $((i * 5))s"
              exit 0
            fi
            echo "Waiting for peat-ffi $FFI_VERSION to be indexed... ($((i * 5))s elapsed)"
            sleep 5
          done
          echo "::error::peat-ffi $FFI_VERSION did not appear on the crates.io sparse index within 5 minutes"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `peat` is currently a reserved-name placeholder facade crate (no
      # public API yet). It has no inter-crate dependencies, but is
      # published last to keep the existing peat-schema → peat-protocol
      # ordering untouched.
      - name: Publish peat (idempotent) and wait for index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v and .yanked == false)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat $VERSION already on crates.io, skipping publish"
          else
            (cd peat && cargo publish)
            for i in $(seq 1 60); do
              if is_indexed; then
                echo "peat $VERSION is indexed after $((i * 5))s"
                exit 0
              fi
              echo "Waiting for peat $VERSION to be indexed... ($((i * 5))s elapsed)"
              sleep 5
            done
            echo "::error::peat $VERSION did not appear on the crates.io sparse index within 5 minutes"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release notes and verify published artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FFI_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "peat-ffi") | .version')
          UA="peat-release (github.com/defenseunicorns/peat)"

          # Pull everything between this version's header and the next one.
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md entry found for $VERSION"
            exit 1
          fi

          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          printf '\n### Published Artifacts\n\n' >> /tmp/release-notes.md
          printf '| Crate | Version | SHA-256 |\n|---|---|---|\n' >> /tmp/release-notes.md
          : > /tmp/release-artifacts.tsv

          verify_artifact() {
            local crate="$1"
            local version="$2"
            local index_url="https://index.crates.io/pe/at/$crate"
            local expected
            local actual

            expected=$(curl -sfL -H "User-Agent: $UA" "$index_url" \
              | jq -er --arg v "$version" 'select(.vers == $v and .yanked == false) | .cksum')
            curl -sfL -H "User-Agent: $UA" \
              "https://crates.io/api/v1/crates/$crate/$version/download" \
              -o "/tmp/$crate-$version.crate"
            actual=$(sha256sum "/tmp/$crate-$version.crate" | cut -d ' ' -f 1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$crate $version archive checksum $actual does not match sparse index $expected"
              exit 1
            fi

            printf '| [`%s %s`](https://crates.io/crates/%s/%s) | `%s` | `%s` |\n' \
              "$crate" "$version" "$crate" "$version" "$version" "$actual" \
              >> /tmp/release-notes.md
            printf '%s\t%s\t%s\n' "$crate" "$version" "$actual" \
              >> /tmp/release-artifacts.tsv
          }

          verify_artifact peat-schema "$VERSION"
          verify_artifact peat-protocol "$VERSION"
          verify_artifact peat-ffi "$FFI_VERSION"
          verify_artifact peat "$VERSION"

          printf '\n### Tag Workflow Evidence\n\n' >> /tmp/release-notes.md
          printf -- '- CI gates completed before publication in [%s](%s).\n' \
            "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >> /tmp/release-notes.md
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          # Mark pre-releases (rc, alpha, beta) distinctly so they don't show
          # up as the "Latest" release on the repo landing page.
          IS_PRERELEASE=false
          case "$GITHUB_REF_NAME" in
            *-rc.*|*-alpha.*|*-beta.*) IS_PRERELEASE=true ;;
          esac

          # Idempotent: if a release for this tag already exists (e.g. from a
          # prior failed-but-partial run), update its body/flags instead of
          # failing with "release already exists".
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, updating..."
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease="$IS_PRERELEASE"
          else
            if [ "$IS_PRERELEASE" = true ]; then
              gh release create "$GITHUB_REF_NAME" \
                --notes-file /tmp/release-notes.md \
                --title "$GITHUB_REF_NAME" --prerelease
            else
              gh release create "$GITHUB_REF_NAME" \
                --notes-file /tmp/release-notes.md \
                --title "$GITHUB_REF_NAME"
            fi
          fi

          RELEASE=$(gh release view "$GITHUB_REF_NAME" \
            --json name,tagName,isDraft,isPrerelease,body,url)
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$IS_PRERELEASE" \
            '.name == $tag and .tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' <<< "$RELEASE" \
            > /dev/null
          BODY=$(jq -r '.body' <<< "$RELEASE")
          EXPECTED_BODY=$(</tmp/release-notes.md)
          if [ "$BODY" != "$EXPECTED_BODY" ]; then
            echo "::error::Published release body does not exactly match the reviewed notes and generated evidence"
            exit 1
          fi
          while IFS=$'\t' read -r crate version checksum; do
            if [[ "$BODY" != *"$crate $version"* || "$BODY" != *"$checksum"* ]]; then
              echo "::error::Published release is missing $crate $version checksum evidence"
              exit 1
            fi
          done < /tmp/release-artifacts.tsv
          if [[ "$BODY" != *"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"* ]]; then
            echo "::error::Published release is missing tag-workflow CI evidence"
            exit 1
          fi
          echo "Verified $(jq -r '.url' <<< "$RELEASE")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
