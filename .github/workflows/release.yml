name: Release

# Tag-triggered release pipeline for the peat workspace.
#
# On push of a `v*` tag, this workflow:
#   1. Reuses the regular CI gates (format, clippy, tests, feature builds).
#   2. Verifies the tag version matches `[workspace.package].version` in Cargo.toml.
#   3. Publishes `peat-schema` to crates.io, then waits for the index to
#      propagate, then publishes `peat-protocol`. Order matters — peat-protocol
#      depends on peat-schema by version.
#   4. Creates a GitHub release with the CHANGELOG.md entry as the body.
#
# Prerequisites:
#   - `CARGO_REGISTRY_TOKEN` repository secret with publish-new-crates scope.
#
# See `docs/RELEASING.md` for the end-to-end release process this workflow
# automates.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Secrets do not propagate to reusable workflows automatically. The called
    # CI workflow's test and test-e2e jobs consume PEAT_APP_ID / PEAT_SHARED_KEY,
    # so we inherit the caller's full secret set.
    secrets: inherit

  validate-tag:
    name: Validate tag matches workspace version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare tag vs workspace.package.version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "peat-protocol") | .version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match workspace version $VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches workspace version $VERSION"

  publish:
    name: Publish to crates.io
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        # Match ci.yml — `.cargo/config.toml` forces `-fuse-ld=mold` for the
        # x86_64-unknown-linux-gnu target, so `cargo publish`'s verify step
        # needs mold, clang, and the dbus headers (pulled transitively by
        # some BLE-adjacent deps) to link.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      # Each publish step is idempotent: if the version is already on the
      # crates.io sparse index (what cargo itself reads), the publish is
      # skipped. This lets us re-run the job safely after any intermediate
      # failure without hitting "crate already uploaded" errors.
      #
      # The sparse index (index.crates.io) is preferred over the v1 API
      # because it is what cargo uses during dependency resolution, so
      # appearance on the sparse index is the authoritative "fully
      # published" signal. The v1 API sits behind a longer-lived CDN cache
      # that can mask a fresh publish for minutes.
      - name: Publish peat-schema (idempotent) and wait for index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat-schema"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat-schema $VERSION already on crates.io, skipping publish"
          else
            (cd peat-schema && cargo publish)
            for i in $(seq 1 60); do
              if is_indexed; then
                echo "peat-schema $VERSION is indexed after $((i * 5))s"
                exit 0
              fi
              echo "Waiting for peat-schema $VERSION to be indexed... ($((i * 5))s elapsed)"
              sleep 5
            done
            echo "::error::peat-schema $VERSION did not appear on the crates.io sparse index within 5 minutes"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # peat-protocol depends on peat-btle (and peat-mesh via the workspace)
      # at versions that may be ahead of what's on crates.io while the
      # Slice-4 train is in flight (see workspace `[patch.crates-io]` and
      # `supply-chain/config.toml` notes referencing peat#828). When the
      # required peat-btle version isn't yet on crates.io, the
      # `cargo publish` verify step fails with "failed to select a version
      # for the requirement `peat-btle = …`". We can't fix that from this
      # repo — peat-btle must publish first. Until then, this step
      # gracefully skips peat-protocol publish and lets the release
      # workflow continue (tag, GitHub release, SBOM, peat-schema publish
      # still produce). Once peat-btle 0.4.0 lands on crates.io, the
      # required-version check passes and publish runs normally.
      - name: Publish peat-protocol (idempotent, skip if peat-btle dep gap)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat-protocol"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null 2>&1
          }

          # Extract peat-btle's required version from the workspace and
          # check whether ANY version on crates.io satisfies it. If not,
          # skip with a clear message rather than failing the release.
          peat_btle_req=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_metadata // {} | .dependencies // [] | .[]? | select(.name == "peat-btle") | .req' || echo "")
          # Fallback: parse directly from workspace Cargo.toml if metadata path is empty
          if [ -z "$peat_btle_req" ]; then
            peat_btle_req=$(grep -E "^peat-btle\s*=" Cargo.toml | head -1 | sed -n 's/.*version = "\([^"]*\)".*/\1/p')
          fi
          echo "peat-btle workspace req: $peat_btle_req"

          peat_btle_versions=$(curl -sfL -H "User-Agent: $UA" "https://index.crates.io/pe/at/peat-btle" 2>/dev/null \
            | jq -r '.vers' | sort -u || echo "")
          echo "peat-btle versions on crates.io:"
          echo "$peat_btle_versions" | head -10

          # Use cargo to verify resolution would succeed before attempting
          # to publish. The verify step inside `cargo publish` will run
          # the same resolver; we check upfront so we can skip cleanly.
          if ! (cd peat-protocol && cargo check --offline 2>/dev/null); then
            : # offline check unavailable; proceed and let publish error tell us
          fi

          if is_indexed; then
            echo "peat-protocol $VERSION already on crates.io, skipping publish"
            exit 0
          fi

          # Attempt the publish but treat the specific "peat-btle dep gap"
          # error as a known-skipable condition.
          publish_log=$(mktemp)
          if (cd peat-protocol && cargo publish 2>&1 | tee "$publish_log"); then
            for i in $(seq 1 60); do
              if is_indexed; then
                echo "peat-protocol $VERSION is indexed after $((i * 5))s"
                exit 0
              fi
              echo "Waiting for peat-protocol $VERSION to be indexed... ($((i * 5))s elapsed)"
              sleep 5
            done
            echo "::error::peat-protocol $VERSION did not appear on the crates.io sparse index within 5 minutes"
            exit 1
          else
            if grep -q "failed to select a version for the requirement \`peat-btle" "$publish_log"; then
              echo "::warning::peat-protocol $VERSION publish skipped — peat-btle dep gap"
              echo "::warning::peat-protocol's required peat-btle version isn't on crates.io yet (Slice-4.b train; peat#828). Publish will succeed once peat-btle catches up. Release artifacts (tag, GitHub release, SBOM, peat-schema) still produced."
              exit 0
            fi
            cat "$publish_log"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `peat` is currently a reserved-name placeholder facade crate (no
      # public API yet). It has no inter-crate dependencies, but is
      # published last to keep the existing peat-schema → peat-protocol
      # ordering untouched.
      - name: Publish peat (idempotent) and wait for index
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          UA="peat-release (github.com/defenseunicorns/peat)"
          INDEX_URL="https://index.crates.io/pe/at/peat"

          is_indexed() {
            curl -sfL -H "User-Agent: $UA" "$INDEX_URL" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null 2>&1
          }

          if is_indexed; then
            echo "peat $VERSION already on crates.io, skipping publish"
          else
            (cd peat && cargo publish)
            for i in $(seq 1 60); do
              if is_indexed; then
                echo "peat $VERSION is indexed after $((i * 5))s"
                exit 0
              fi
              echo "Waiting for peat $VERSION to be indexed... ($((i * 5))s elapsed)"
              sleep 5
            done
            echo "::error::peat $VERSION did not appear on the crates.io sparse index within 5 minutes"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull everything between this version's header and the next one.
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md entry found for $VERSION, falling back to auto-generated notes"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NOTES" > /tmp/release-notes.md
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          # Mark pre-releases (rc, alpha, beta) distinctly so they don't show
          # up as the "Latest" release on the repo landing page.
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-rc.*|*-alpha.*|*-beta.*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          if [ "${{ steps.changelog.outputs.fallback }}" = "true" ]; then
            NOTES_ARG="--generate-notes"
          else
            NOTES_ARG="--notes-file /tmp/release-notes.md"
          fi

          # Idempotent: if a release for this tag already exists (e.g. from a
          # prior failed-but-partial run), update its body/flags instead of
          # failing with "release already exists".
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, updating..."
            gh release edit "$GITHUB_REF_NAME" $PRERELEASE_FLAG \
              $(if [ "${{ steps.changelog.outputs.fallback }}" != "true" ]; then echo "--notes-file /tmp/release-notes.md"; fi)
          else
            gh release create "$GITHUB_REF_NAME" $NOTES_ARG $PRERELEASE_FLAG
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
