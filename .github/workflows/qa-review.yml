name: QA Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-review:
    name: Peat QA Review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: peat-arm64-linux-gb10
    # 40m budget. Round-3 incremental reviews on substantive PRs (verifying
    # multiple prior-round findings + a new delta) have observed real work
    # of ~9 min plus agentic finalization, which exceeded the previous 15m
    # cap. The two-tier model strategy (3 Opus 4.7 attempts → 1 Sonnet 4.6
    # fallback) adds worst-case ~18 min of failed-Opus retries before Sonnet
    # runs, so 40m keeps headroom for a substantive Sonnet fallback review.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing review
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Hash of the PR title/body/base — the review INPUTS that live OUTSIDE the commit
          # SHA. PR-description evidence is part of what we review, and an `edited` event can
          # change it without changing the head SHA. Piped gh -> jq -> sha256sum so the
          # untrusted title/body never enters the shell (no interpolation = no injection).
          META=$(gh pr view "$PR_NUMBER" --json title,body,baseRefName --jq '{title,body,baseRefName}' | sha256sum | cut -c1-12)
          echo "meta=${META}" >> "$GITHUB_OUTPUT"

          REVIEWS=$(gh pr view "$PR_NUMBER" --json reviews)

          # Skip only when a prior review matches BOTH the current head SHA AND the current
          # title/body/base hash. Same SHA + a NEW hash (a title/description fix) must
          # re-review, not skip — that was the bug: description fixes never re-triggered.
          if echo "$REVIEWS" | jq -e \
               --arg sha "Peat QA Review (SHA: ${SHORT_SHA})" \
               --arg meta "peat-qa-meta: ${META}" \
               '.reviews[] | select((.body | contains($sha)) and (.body | contains($meta)))' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Review PR with Claude Code
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          META:                   ${{ steps.check.outputs.meta }}
        run: |
          set -uo pipefail
          set +e   # GH Actions defaults to bash -e; -e would abort before rc=$? captures the claude exit code

          # Fork PRs receive an empty secret (GitHub strips secrets from fork
          # pull_request events). Unset the var so claude falls back to the
          # runner-local credential (~/.claude/.credentials.json).
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty (expected for fork PRs) — falling back to runner-local credentials"
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA="${{ steps.check.outputs.short_sha }}"

          # Two-tier resilience against upstream model incidents — status.claude.com
          # has logged near-daily Opus 4.7 elevated-error windows in May 2026:
          #   Primary:  up to 3 attempts on Opus 4.7, 15s apart.
          #   Fallback: 1 attempt on Sonnet 4.6 with a disclaimer in the review body
          #             so reviewers know [ARCH] coverage may be reduced and can
          #             re-run CI when full architectural review is needed.
          # Prompt template is single-quoted (preserves backticks); envsubst injects
          # the per-model header line via $START_LINE.

          # Idempotency check — used inside the Opus loop and again before the
          # Sonnet fallback. `gh pr review --approve/--request-changes` posts to
          # the reviews endpoint; check --json reviews here and in the top-level
          # "Check for existing review" step.
          already_posted() {
            gh pr view "$PR_NUMBER" --json reviews \
              | jq -e --arg sha "Peat QA Review (SHA: ${SHORT_SHA})" --arg meta "peat-qa-meta: ${META}" \
                   '.reviews[] | select((.body | contains($sha)) and (.body | contains($meta)))' >/dev/null 2>&1
          }

          submit_review() {
            local verdict verb peat_bot_token
            verdict=$(tr -d '[:space:]' < "$RUNNER_TEMP/peat-qa-verdict" 2>/dev/null || true)
            case "$verdict" in
              changes-requested) verb="--request-changes" ;;
              approve)           verb="--approve" ;;
              *)
                echo "::warning::peat-qa-verdict missing or unrecognized ('${verdict}') — defaulting to --request-changes"
                verb="--request-changes"
                ;;
            esac
            # Defense in depth over the agent-written verdict file: the review
            # BODY is authoritative for the *safe* direction. If the verdict says
            # approve but the body carries a request-changes finding tag
            # ([BLOCKER]/[WARNING]/[ARCH]) as a heading/bullet/line-start marker,
            # downgrade to --request-changes. Anchored to line-start markers so
            # prose/backtick mentions ("no [BLOCKER] issues", "any `[WARNING]`
            # tag") do NOT false-trigger; [IDIOM] is intentionally not a trigger.
            # This only ever downgrades approve->request-changes, never upgrades,
            # so it closes the body/verdict divergence window fail-closed.
            if [ "$verb" = "--approve" ] && \
               grep -qE '^[[:space:]]*(#{1,6}[[:space:]]+|[-*][[:space:]]+)?\[(BLOCKER|WARNING|ARCH)\]' \
                 "$RUNNER_TEMP/peat-qa-review.md" 2>/dev/null; then
              echo "::warning::verdict file said 'approve' but the review body contains a [BLOCKER]/[WARNING]/[ARCH] finding — downgrading to --request-changes (fail-closed)"
              verb="--request-changes"
            fi
            peat_bot_token=$(gh auth token --user peat-bot 2>/dev/null)
            if [ -z "$peat_bot_token" ]; then
              echo "::error::could not retrieve peat-bot token from host gh credential store"
              exit 1
            fi
            # Stamp the title/body/base hash into the posted review so future runs can
            # distinguish "already reviewed this exact PR state" from "description changed
            # since". HTML comment: invisible in the rendered review, and its line never
            # starts with a finding marker so the fail-closed grep above never trips on it.
            printf '\n\n<!-- peat-qa-meta: %s -->\n' "$META" >> "$RUNNER_TEMP/peat-qa-review.md"
            if ! GH_TOKEN="$peat_bot_token" gh pr review "$PR_NUMBER" $verb --body-file "$RUNNER_TEMP/peat-qa-review.md"; then
              echo "::error::gh pr review ${verb} failed — verdict not posted"
              exit 1
            fi
          }

          emit_prompt() {
            # Expand both $START_LINE (per-model header) and $RUNNER_TEMP so the
            # agent receives the real absolute artifact paths. Without
            # $RUNNER_TEMP in the allowlist the prompt handed the agent the
            # literal string "$RUNNER_TEMP/peat-qa-review.md", which it could not
            # resolve — so it narrated the review to stdout instead of writing
            # the body/verdict files, and submit_review found neither file.
            START_LINE="$1" envsubst '$START_LINE $RUNNER_TEMP' <<'PROMPT'
          You are the QA review agent for the Peat Protocol ecosystem.

          Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} (HEAD: ${{ steps.check.outputs.short_sha }}).

          Steps:
          1. Run: gh pr diff ${{ github.event.pull_request.number }}
          2. Run: gh pr view ${{ github.event.pull_request.number }}
             NOTE: this review can be re-triggered by an `edited` event — a change to the PR
             title or description with no new commit. Evaluate the criteria against the
             CURRENT title/description fetched in this step, especially any finding that
             would depend on PR-description evidence. A concern that the corrected
             description now satisfies should not be flagged.
          3. Fetch prior QA reviews on this PR:
             Run: gh pr view ${{ github.event.pull_request.number }} --json reviews --jq '.reviews[] | select(.body | contains("Peat QA Review")) | .body'
             This is an INCREMENTAL review. Read the prior review bodies carefully.
             A finding is ALREADY ADDRESSED if ANY of these apply:
               (a) It was flagged in a prior QA review AND the current diff resolves it (code changed to fix it).
               (b) It is explicitly tracked in the PR body's pre-merge checklist (the author already knows).
               (c) It predates this PR's diff entirely (pre-existing issue not introduced by this branch).
             Do NOT re-flag already-addressed findings. If a prior review flagged something and the
             current push did not change the relevant code, it is still addressed by (b) or (c) — do
             not repeat it. Only flag a prior finding again if the author's attempted fix is itself wrong.
             If all findings from prior reviews are addressed and no new issues exist, the review is clean.
          4. Review the diff against these criteria:
             - Protocol/schema: backward-compatible with cap-schema; check ADR decisions
             - peat-mesh: must not break Automerge sync semantics or Iroh peer discovery
             - peat-ffi / peat-btle: FFI/BLE changes must validate all platform bindings (Android JNI, iOS UniFFI, Linux BlueZ, aarch64)
             - Test surface coverage: changes that add or modify a public API surface (UniFFI export,
               JNI extern fn, Translator trait impl, Kotlin AAR public method, native lib symbol,
               OutboundSink, fanout registration, codec adapter fn) MUST include bidirectional E2E
               tests at the surface tier consumers actually hit, not just internal-struct unit tests.
               If a method or field is added to a UniFFI / JNI / FFI wrapper, the test must exercise
               the wrapper round-trip — encode-via-wrapper AND decode-via-wrapper. Internal-struct
               tests verify the codec; surface-tier tests verify the actual exposed API consumers
               will use. Reference shape: peat-btle's `tests/peat_lite_uniffi_e2e.rs` (PR #57)
               instantiates the UniFFI-wrapped `PeatMesh` and exercises both directions through the
               wrapper, so wrapper-vs-internal gaps fail at compile/test time, not at downstream
               link time. peat-ffi's `lite_bridge_outbound_frame_tests` (PR #841) does the same at
               the JNI tier — registers translators on a real TransportManager, fans out via the
               same path the JNI consumer uses, asserts the OutboundSink saw the right bytes.
                 - Missing surface-tier E2E on a new exposed method/field → [BLOCKER]
                 - Missing receive-side test on a round-trippable API → [BLOCKER]
                 - Coverage on one direction only (encode-only, decode-only) → [WARNING]
             - Security primitives: Ed25519/X25519/ChaCha20/HMAC-SHA256 — flag any deviation as [BLOCKER]
             - Performance: flag anything likely to increase convergence latency >20% or bandwidth beyond baselines
             - peat-lite: must maintain OTA safety and A/B partition integrity
             - Implementation idiom: flag code that fights the language rather than working with it
               (Rust ignoring borrow checker via excessive clone/unwrap; Go swallowing errors or building
               Java-style hierarchies; TS abusing `any`; Kotlin/Swift ignoring platform conventions).
               This is NOT formatter/style nitpicking — rustfmt/gofmt/prettier handles that.
             - Architectural reach: if a change crosses crate boundaries, alters protocol/transport
               semantics, or sits in ADR territory in a way warranting design discussion, escalate.
          5. Write findings using the Write tool:
             (a) Save the complete review body to $RUNNER_TEMP/peat-qa-review.md.
                 Start the body with EXACTLY (including the leading "## "):
          $START_LINE
                 Every finding must carry a tag with a defined action. Do NOT post optional/nice-to-have
                 observations — if a finding has no clear action, omit it.
                 Severity tags:
                   [BLOCKER]  — must fix before merge
                   [WARNING]  — should fix, may merge with justification
                   [IDIOM]    — non-idiomatic implementation for the language; worth fixing, not blocking
                   [ARCH]     — architectural concern requiring human design review; do NOT propose a fix, escalate
                 If there are no findings under any tag, write a single line: "No findings."
             (b) Use the Write tool to write the verdict to $RUNNER_TEMP/peat-qa-verdict:
                 Write exactly: changes-requested if any [BLOCKER], [WARNING], or [ARCH] finding is present.
                 Write exactly: approve if the review is clean or has only [IDIOM] findings.
                 No other content in that file.
             (c) Do NOT call gh pr review — the workflow posts the official review after you finish.
          PROMPT
          }

          OPUS_START_LINE="## Peat QA Review (SHA: ${SHORT_SHA})"
          # Sonnet fallback header is two lines (header + disclaimer). The literal
          # newline flows through envsubst into the prompt; reviewers see the
          # disclaimer in the posted comment so they can re-run CI on substantive
          # PRs when full [ARCH] coverage is needed.
          SONNET_START_LINE="## Peat QA Review (SHA: ${SHORT_SHA}) — fallback model: Sonnet 4.6
          > Opus 4.7 was unavailable; this review was produced by Sonnet 4.6. [ARCH] coverage may be reduced — re-run CI on this PR when Opus is available if full architectural review is needed."

          MAX_OPUS_ATTEMPTS=3
          rc=0

          for attempt in $(seq 1 $MAX_OPUS_ATTEMPTS); do
            echo "::group::QA Review Opus 4.7 attempt ${attempt}/${MAX_OPUS_ATTEMPTS}"

            if already_posted; then
              echo "Review for SHA ${SHORT_SHA} (meta ${META}) already posted; treating as success."
              echo "::endgroup::"
              exit 0
            fi

            emit_prompt "$OPUS_START_LINE" \
              | claude -p --model claude-opus-4-7 \
                  --allowedTools 'Bash(gh pr diff *),Bash(gh pr view *),Write'
            rc=$?
            echo "::endgroup::"

            if [ "$rc" -eq 0 ]; then
              submit_review
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_OPUS_ATTEMPTS" ]; then
              echo "Opus 4.7 attempt ${attempt} failed (claude -p exit ${rc}); sleeping 15s before retry..."
              sleep 15
            fi
          done

          echo "All ${MAX_OPUS_ATTEMPTS} Opus 4.7 attempts failed; falling back to Sonnet 4.6."
          echo "::group::QA Review Sonnet 4.6 fallback"

          if already_posted; then
            echo "Review for SHA ${SHORT_SHA} (meta ${META}) already posted; treating as success."
            echo "::endgroup::"
            exit 0
          fi

          emit_prompt "$SONNET_START_LINE" \
            | claude -p --model claude-sonnet-4-6 \
                --allowedTools 'Bash(gh pr diff *),Bash(gh pr view *),Write'
          rc=$?
          echo "::endgroup::"

          if [ "$rc" -eq 0 ]; then
            submit_review
            exit 0
          fi

          echo "Sonnet 4.6 fallback also failed (likely a broader Anthropic API incident — see status.claude.com)."
          exit 1
