name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow the release workflow (.github/workflows/release.yml) to reuse this
  # pipeline as a gate before publishing to crates.io.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce debug info to save disk space on runners
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ============================================
  # Quick checks (always run, parallel, ~3 min)
  # ============================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  m5stack-dep-gate:
    # Refuses to merge a Cargo.toml that pins peat-btle as a path dep
    # (e.g. `path = "../../../peat-btle"`). Path deps resolve only on
    # developer machines where the sibling repo is checked out, so a
    # mis-ordered merge that lands a path-pinned firmware-build silently
    # breaks any consumer who clones only this repo. Once peat-btle's
    # release publishes to crates.io, the dep promotes to a registry
    # pin and this gate goes green; until then it intentionally blocks
    # the merge so the release-order constraint is enforced by CI
    # rather than human discipline.
    name: M5Stack peat-btle dep gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify peat-btle is a registry pin (not a path dep)
        run: |
          set -euo pipefail
          MANIFEST=examples/m5stack-core2-peat/Cargo.toml
          # Catch both inline form (`peat-btle = { ..., path = ... }`)
          # and table form (`[dependencies.peat-btle]` ... `path = ...`)
          # — the inline-only grep used to silently miss table-style
          # deps, letting a contributor sneak a path dep past the gate.
          # An explicit awk pass covers the table case.
          inline_hit=$(grep -E '^\s*peat-btle\s*=.*\bpath\s*=' "$MANIFEST" || true)
          table_hit=$(awk '
            /^\[dependencies\.peat-btle\]/ { in_table=1; next }
            in_table && /^\[/             { in_table=0 }
            in_table && /^\s*path\s*=/    { print FILENAME ":" NR ": " $0 }
          ' "$MANIFEST")
          if [ -n "$inline_hit$table_hit" ]; then
            echo "::error file=$MANIFEST::peat-btle is still a path dep — promote to an exact registry pin (e.g. peat-btle = \"=0.3.4-rc.2\") before merging. The current rc on crates.io is the version this firmware's slim publish surface depends on."
            [ -n "$inline_hit" ] && echo "$inline_hit"
            [ -n "$table_hit"  ] && echo "$table_hit"
            exit 1
          fi
          echo "M5Stack peat-btle dep is registry-sourced — gate clear."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: clippy

      # Exclude peat-ffi: UniFFI-generated cdylib has its own lint baseline
      - run: cargo clippy --all-targets --all-features --workspace --exclude peat-ffi -- -D warnings

  # ============================================
  # Unit & Integration Tests (excludes E2E, ~5 min)
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: test

      - name: Run unit & integration tests
        env:
          PEAT_APP_ID: ${{ secrets.PEAT_APP_ID }}
          PEAT_SHARED_KEY: ${{ secrets.PEAT_SHARED_KEY }}
        run: |
          cargo nextest run --all-features --workspace --exclude peat-ffi -E 'not test(e2e)'

  # ============================================
  # E2E Tests (parallel job, ~3 min)
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: test-e2e

      - name: Run E2E tests
        env:
          PEAT_APP_ID: ${{ secrets.PEAT_APP_ID }}
          PEAT_SHARED_KEY: ${{ secrets.PEAT_SHARED_KEY }}
        run: |
          cargo nextest run --all-features --workspace --exclude peat-ffi -E 'test(e2e)'

  # ============================================
  # Documentation Build (#702)
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev
      - name: Build docs
        run: cargo doc --no-deps --workspace --exclude peat-ffi
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============================================
  # Feature Combinations (#699)
  # ============================================
  feature-matrix:
    name: Feature build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--features automerge-backend"
          - "--features lite-transport"
          - "--no-default-features --features automerge-backend"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --exclude peat-ffi ${{ matrix.features }}

  # ============================================
  # Security Audit
  # ============================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: Run audit (fail on vulnerabilities, warn on unmaintained)
        # cargo-audit doesn't read deny.toml and its only config-file path is
        # ~/.cargo/audit.toml (outside the repo). Inline `--ignore` flags here
        # are the canonical mechanism for workspace-tracked exceptions. **Each
        # entry below MUST have a matching entry in deny.toml `[advisories]
        # ignore` with the same RUSTSEC id and reason** — drop from both files
        # in the same PR when a fix becomes reachable.
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            2>&1 || true
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --json 2>/dev/null | jq -e '.vulnerabilities.count == 0'

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: supply-chain

      - name: Install cargo-deny and cargo-vet
        run: cargo install cargo-deny cargo-vet --quiet

      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources

      - name: Run cargo-vet
        run: cargo vet
