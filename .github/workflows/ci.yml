name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow the release workflow (.github/workflows/release.yml) to reuse this
  # pipeline as a gate before publishing to crates.io.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce debug info to save disk space on runners
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Pin the Linux fast linker for CI (mold + clang) — the unconditional pin used
  # to live in .cargo/config.toml but was moved to env so devs without mold installed
  # don't hit a hard build break. Each job's apt-get step still installs `mold` and `clang`.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  # ============================================
  # Quick checks (always run, parallel, ~3 min)
  # ============================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  m5stack-dep-gate:
    # Refuses to merge a Cargo.toml that pins peat-btle as a path dep
    # (e.g. `path = "../../../peat-btle"`). Path deps resolve only on
    # developer machines where the sibling repo is checked out, so a
    # mis-ordered merge that lands a path-pinned firmware-build silently
    # breaks any consumer who clones only this repo. Once peat-btle's
    # release publishes to crates.io, the dep promotes to a registry
    # pin and this gate goes green; until then it intentionally blocks
    # the merge so the release-order constraint is enforced by CI
    # rather than human discipline.
    name: M5Stack peat-btle dep gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify peat-btle is a registry pin (not a path dep)
        run: |
          set -euo pipefail
          MANIFEST=examples/m5stack-core2-peat/Cargo.toml
          # Catch both inline form (`peat-btle = { ..., path = ... }`)
          # and table form (`[dependencies.peat-btle]` ... `path = ...`)
          # — the inline-only grep used to silently miss table-style
          # deps, letting a contributor sneak a path dep past the gate.
          # An explicit awk pass covers the table case.
          inline_hit=$(grep -E '^\s*peat-btle\s*=.*\bpath\s*=' "$MANIFEST" || true)
          table_hit=$(awk '
            /^\[dependencies\.peat-btle\]/ { in_table=1; next }
            in_table && /^\[/             { in_table=0 }
            in_table && /^\s*path\s*=/    { print FILENAME ":" NR ": " $0 }
          ' "$MANIFEST")
          if [ -n "$inline_hit$table_hit" ]; then
            echo "::error file=$MANIFEST::peat-btle is still a path dep — promote to an exact registry pin (e.g. peat-btle = \"=0.3.4-rc.2\") before merging. The current rc on crates.io is the version this firmware's slim publish surface depends on."
            [ -n "$inline_hit" ] && echo "$inline_hit"
            [ -n "$table_hit"  ] && echo "$table_hit"
            exit 1
          fi
          echo "M5Stack peat-btle dep is registry-sourced — gate clear."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: clippy

      # Exclude peat-ffi: UniFFI-generated cdylib has its own lint baseline
      - run: cargo clippy --all-targets --all-features --workspace --exclude peat-ffi -- -D warnings

  # ============================================
  # Unit & Integration Tests (excludes E2E, ~5 min)
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: test

      - name: Run unit & integration tests
        env:
          PEAT_APP_ID: ${{ secrets.PEAT_APP_ID }}
          PEAT_SHARED_KEY: ${{ secrets.PEAT_SHARED_KEY }}
        run: |
          cargo nextest run --all-features --workspace --exclude peat-ffi -E 'not test(e2e)'

  # ============================================
  # E2E Tests (parallel job, ~3 min)
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: test-e2e

      - name: Run E2E tests
        env:
          PEAT_APP_ID: ${{ secrets.PEAT_APP_ID }}
          PEAT_SHARED_KEY: ${{ secrets.PEAT_SHARED_KEY }}
        run: |
          cargo nextest run --all-features --workspace --exclude peat-ffi -E 'test(e2e)'

  # ============================================
  # Documentation Build (#702)
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev
      - name: Build docs
        run: cargo doc --no-deps --workspace --exclude peat-ffi
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============================================
  # Feature Combinations (#699)
  # ============================================
  feature-matrix:
    name: Feature build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--features automerge-backend"
          - "--features lite-transport"
          - "--no-default-features --features automerge-backend"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --exclude peat-ffi ${{ matrix.features }}

  # ============================================
  # Security Audit
  # ============================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        # `cargo install cargo-audit` below compiles cargo-audit from source, which
        # links via the workflow-level mold/clang env override — install both.
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: Run audit (fail on vulnerabilities, warn on unmaintained)
        # cargo-audit doesn't read deny.toml and its only config-file path is
        # ~/.cargo/audit.toml (outside the repo). Inline `--ignore` flags here
        # are the canonical mechanism for workspace-tracked exceptions. **Each
        # entry below MUST have a matching entry in deny.toml `[advisories]
        # ignore` with the same RUSTSEC id and reason** — drop from both files
        # in the same PR when a fix becomes reachable.
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            2>&1 || true
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --json 2>/dev/null | jq -e '.vulnerabilities.count == 0'

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: supply-chain

      - name: Install cargo-deny and cargo-vet
        run: cargo install cargo-deny cargo-vet --quiet

      - name: Run cargo-deny
        run: cargo deny check advisories bans licenses sources

      - name: Run cargo-vet
        run: cargo vet

  android-test:
    # peat-ffi surface-tier instrumented tests (peat#885 / peat#888).
    # Runs on the peat-arm64-linux-gb10 self-hosted runner with a real
    # arm64 Android device attached via adb — same physical runner as
    # peat-mesh#145's android-test. NDK, SDK, JDK, and adb are
    # assumed pre-installed on the host.
    #
    # Scope: locks in JNI-bridge contracts that the in-crate Rust unit
    # tests can't cover (env.throw_new ↔ Kotlin RuntimeException
    # propagation, RegisterNatives, System.loadLibrary survival
    # without consumer-supplied PeerEventManager). peat-mesh#145
    # carries the broader two-backend sync surface coverage on the
    # consumer side.
    name: peat-ffi Android Surface Test
    runs-on: peat-arm64-linux-gb10
    env:
      ANDROID_HOME: /home/kit/Android/Sdk
      ANDROID_SDK_ROOT: /home/kit/Android/Sdk
      ANDROID_NDK_HOME: /home/kit/Android/Sdk/ndk/android-ndk-r27d
    steps:
      - uses: actions/checkout@v4

      - name: Export Android tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install protoc
        # peat-schema's build script invokes `prost-build`, which shells
        # out to `protoc`. Hosted ubuntu-latest runners install it via
        # apt-get, but the self-hosted Arch runner has no apt. Pulling
        # the pinned upstream release binary is portable across runner
        # distros and needs no sudo. peat#888 first surfaced this gap.
        run: |
          set -euo pipefail
          PROTOC_VERSION=28.3
          # SHA256 of protoc-28.3-linux-aarch_64.zip from the upstream
          # release: https://github.com/protocolbuffers/protobuf/releases/tag/v28.3
          # Pinned to integrity-protect the supply chain. Bump alongside
          # PROTOC_VERSION when the build script needs a newer protoc.
          PROTOC_SHA256=1de522032a8b194002fe35cab86d747848238b5e4de4f99648372079f5b46f9a
          PROTOC_DIR="$RUNNER_TEMP/protoc-$PROTOC_VERSION"
          if [ ! -x "$PROTOC_DIR/bin/protoc" ]; then
            mkdir -p "$PROTOC_DIR"
            curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-aarch_64.zip"
            echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$PROTOC_DIR"
          fi
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$PROTOC_DIR/bin/protoc" >> "$GITHUB_ENV"
          "$PROTOC_DIR/bin/protoc" --version

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 device + the AAR's other two ABIs for the buildNativeLibs
          # task. The Gradle task builds all three by design (AAR ships
          # arm64-v8a + armeabi-v7a + x86_64); even though the device
          # only loads arm64-v8a, the buildNativeLibs script fails fast
          # if any target rustup isn't installed.
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Wait for adb device
        timeout-minutes: 1
        run: |
          adb start-server
          adb wait-for-device
          adb devices -l
          DEVICE_COUNT=$(adb devices | awk 'NR>1 && /device$/ {n++} END{print n+0}')
          if [ "$DEVICE_COUNT" -ne 1 ]; then
            echo "expected exactly 1 attached device, got $DEVICE_COUNT" >&2
            exit 1
          fi

      - name: Clear device logcat buffer
        run: adb logcat -c

      - name: Build native libraries
        working-directory: peat-ffi/android
        # connectedCheck packages the test APK from src/main/jniLibs/,
        # which is populated by this task. The standard `buildAar`
        # task chain includes this dependency; connectedCheck doesn't,
        # so we run it explicitly.
        run: ./gradlew buildNativeLibs

      - name: Run instrumented tests on attached device
        working-directory: peat-ffi/android
        # connectedCheck → connectedDebugAndroidTest builds the test
        # APK + main APK, installs both via adb, runs the
        # androidTest source set via AndroidJUnitRunner, collects
        # results into build/outputs/androidTest-results/.
        run: ./gradlew connectedCheck

      - name: Capture logcat
        if: always()
        run: |
          mkdir -p peat-ffi/android/build/logcat
          adb logcat -d > peat-ffi/android/build/logcat/full.txt
          adb logcat -d \
            *:E \
            PeatRust:V \
            DEBUG:V \
            AndroidRuntime:V \
            TestRunner:V \
            > peat-ffi/android/build/logcat/peat-and-crash.txt || true
          echo "--- error-level + peat-tagged logcat (tail 200) ---"
          tail -n 200 peat-ffi/android/build/logcat/peat-and-crash.txt

      - name: Upload logcat + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peat-ffi-android-test-artifacts-${{ github.run_id }}
          path: |
            peat-ffi/android/build/logcat/
            peat-ffi/android/build/reports/androidTests/
            peat-ffi/android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
