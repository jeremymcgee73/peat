
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

# First-party workspace crates that also publish to crates.io.
# cargo-vet would otherwise flag them as "non-crates.io-fetched packages match
# published crates.io versions" because the local path dep and the published
# artifact resolve to the same version. Setting audit-as-crates-io = true tells
# vet to audit the local copy as if it were the crates.io version (which is
# accurate — we are the publisher).
#
# Add an entry here only AFTER the crate's first publish — `audit-as-crates-io
# = true` makes vet attempt to fetch the crate from crates.io, which fails with
# "Cannot fetch crate information" if the crate is not yet published.
# peat-protocol's entry should land in a follow-up PR after its first release.
[policy.peat-schema]
audit-as-crates-io = true

[policy.peat-protocol]
audit-as-crates-io = true

# Reserved-name placeholder crate. `peat:0.9.0-rc.4` was published
# to crates.io as part of the 2026-05-11 rc.4 release flow; once a
# name is reserved with a real version, every subsequent workspace
# version bump trips cargo-vet's "non-crates.io-fetched packages
# match published crates.io versions" check unless we declare a
# policy. Same `audit-as-crates-io = true` shape as peat-schema /
# peat-protocol — treat the local path crate as auditable under
# the crates.io identity.
[policy.peat]
audit-as-crates-io = true

# Slice-4.d cutover (2026-05-12, peat#852): the `[policy.peat-mesh]`
# + `[policy.peat-btle]` audit-as-crates-io=false entries that lived
# here during the git-override interim were removed when the workspace
# `[patch.crates-io]` block was dropped. With both crates now
# resolving from crates.io directly, cargo-vet treats them as normal
# third-party deps (the audit-as-crates-io=false policy is only valid
# for first-party-via-git sources). The actually-consumed versions
# (`peat-mesh 0.9.0-rc.8`, `peat-btle 0.4.0`) are vet-covered by the
# `[[trusted.peat-mesh]]` + `[[trusted.peat-btle]]` publisher-trust
# entries in `supply-chain/audits.toml`, not by version-keyed
# exemptions in this file.

[[exemptions.cc]]
version = "1.2.57"
criteria = "safe-to-deploy"

# First-party workspace crates. audit-as-crates-io pulls them into the vet
# graph as normal crates.io deps; the exemptions record that we (as the
# publisher) are the trust root for these versions. A future CI pass can
# replace these with proper `cargo vet certify` audits if desired.
[[exemptions.peat-schema]]
version = "0.9.0-rc.1"
criteria = "safe-to-deploy"

