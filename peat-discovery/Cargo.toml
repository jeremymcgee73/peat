[package]
name = "peat-discovery"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

# Discovery-specific dependencies
# Note: `mdns-sd` removed under peat#898 (mDNS module retired in favor of
# peat-mesh::discovery::MdnsDiscovery; per SKILL.md transport-agnosticism
# rule, IP-stack-specific discovery code lives in peat-mesh, not here).
toml = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
