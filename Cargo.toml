[workspace]
resolver = "2"
members = [
    "peat",
    "peat-schema",
    "peat-protocol",
    "peat-transport",
    "peat-persistence",
    # `peat-discovery` retired under peat#919 (mDNS-consolidation Phase 3
    # follow-up to peat#898). After Phase 1 deleted its `mdns` module, the
    # remaining `StaticDiscovery` + `HybridDiscovery` had zero in-repo
    # consumers and the crate was never published to crates.io. Retired
    # rather than left in place because the canonical home for discovery
    # strategies is `peat_mesh::discovery` per `peat/SKILL.md`'s
    # transport-agnosticism rule.
    "peat-ffi",
    "examples/peat-tak-bridge",
    "examples/quickstart",
    # NOTE: temporarily commented out to diagnose a cargo cycle-
    # detection issue exposed by the relaxation of the `=`-exact
    # peat-mesh ↔ peat-btle pin policy. peat-ble-test pulls peat-btle
    # directly, and peat-btle ↔ peat-mesh used to have mutually-optional
    # `dep:` declarations (peat-btle's `mesh-translator` feature
    # pulled peat-mesh; peat-mesh's `bluetooth` feature pulled
    # peat-btle). With `=` pins the resolver failed on version
    # mismatch first; with relaxed ranges resolution succeeded and
    # cargo's structural cycle-detection fired.
    #
    # Re-inclusion is part of the ADR-059 Amendment 4 Slice 4.d
    # follow-up under defenseunicorns/peat#828: with the back-edge
    # cycle now structurally dissolved on peat-btle main (Slice 4.b
    # deleted the `mesh-translator` feature + optional `peat-mesh`
    # dep), peat-ble-test should rejoin the workspace once the
    # Slice 4 train clears UAT and crates.io has the post-cycle-break
    # peat-btle release. If it still flushes the resolver under the
    # rev-pinned [patch.crates-io] window, that's a separate finding
    # to log against #828.
    # "examples/peat-ble-test",
]
# New `examples/*` Rust crates: add to `members` if they share this
# workspace's toolchain/lockfile, or to `exclude` if they need their own
# (e.g. embedded ESP32 via xtensa-esp-none-elf).
exclude = ["examples/m5stack-core2-peat"]

# ADR-059 Amendment 4 Slice 4.d — RESOLVED on 2026-05-12.
#
# Both peat-mesh and peat-btle now have post-Slice-4 releases on
# crates.io that consume cleanly:
#   - peat-mesh 0.9.0-rc.8 (#110 AutomergeBackend + #107/#108/#109
#     sync coordinator fix train + relay-default tightening)
#   - peat-btle 0.4.0 (Slice-4.b cycle break: deleted
#     `mesh-translator` Cargo feature + optional `peat-mesh` dep
#     entirely from peat-btle's manifest)
#
# The back-edge structural cyclic-dep that forced the prior
# git-override workaround (peat-mesh 0.9.0-rc.7 and peat-btle
# 0.3.4-rc.5 both still declared the back-edge) is gone, so the
# workspace can now resolve directly from crates.io. The prior
# `[patch.crates-io]` block + its 40 lines of rationale lived here
# until this rc.6 release; see
# [defenseunicorns/peat-mesh#110](https://github.com/defenseunicorns/peat-mesh/pull/110)
# + [defenseunicorns/peat-btle v0.4.0
# release](https://github.com/defenseunicorns/peat-btle/releases/tag/v0.4.0)
# for the resolution train.

[workspace.package]
version = "0.9.0-rc.16"
edition = "2021"
authors = ["Kit Plummer <kitplummer@defenseunicorns.com>"]
license = "Apache-2.0"
repository = "https://github.com/defenseunicorns/peat"

[workspace.dependencies]
# Mesh networking. Range `>=0.9.0-rc.10, <0.9.1` — floor `rc.10`
# ships the auto-sync defer-on-cooldown fix (peat-mesh#118, closes
# defenseunicorns/peat#864) on top of the rc.8 `AutomergeBackend`
# turnkey adapter (peat-mesh#110) + the #107/#108/#109 sync
# coordinator fix train + the rc.9 #115 ping-pong fix. Upper bound
# `<0.9.1` keeps the wire-shape protection at the patch line — any
# `0.9.1+` release requires an explicit re-pin here. Floor advanced to
# rc.12 on 2026-05-18 (peat-mesh#129) — rc.12 is the FIPS-posture
# release per peat ADR-060 §5 (AES-256-GCM + ECDH-P256) and ships the
# at-rest `Cipher` trait (peat-mesh#124). peat-protocol's test
# `reexport_encryption_keypair_dh_exchange` requires the
# `ecdh::SharedSecret::raw_secret_bytes()` accessor that rc.12
# introduced — pinning the floor below rc.12 would let the test fail
# to compile on a downgrade resolve. Floor advanced again to rc.14 on
# 2026-05-21 (peat#900 / peat-mesh#147/#148) — rc.14 introduces
# `MdnsDiscovery::advertise_with_addr` and the DNS-label / handle_removed
# fixes that the consolidated `examples/quickstart` requires. Pinning
# the floor below rc.14 would let the workspace build against a
# peat-mesh missing those APIs. Floor advanced once more to rc.15 on
# 2026-05-21 (peat-mesh#149/#150) — rc.15 closes the receive-side half
# of defenseunicorns/peat#897: `MdnsDiscovery::start` now joins the
# loopback multicast interface (`IfKind::LoopbackV4`/`LoopbackV6`,
# new in `mdns_sd 0.19`), so the literal QUICKSTART Scenario 3 form
# (`--bind 127.0.0.1:PORT --mdns` × N nodes) finally produces a
# working mesh. No peat-side code change required to consume — the
# fix is internal to peat-mesh — but pinning the floor at rc.14
# would mean the workspace could build against a peat-mesh that
# silently regresses loopback discovery.
#
# Floor advanced to rc.16 on 2026-05-22
# (peat-mesh#151 / defenseunicorns/peat#891 / defenseunicorns/peat#907) —
# rc.16 ships the origin-tagged change broadcast (`DocChange`,
# `ChangeOrigin`, `subscribe_to_changes_with_origin`,
# `put_with_origin`) consumed by the propagation task in
# `peat-protocol/src/storage/automerge_backend.rs` to enable
# transitive gossip on hub-and-spoke topologies (the QUICKSTART
# Scenario 2 / 4 promise). Pinning the floor below rc.16 would let
# the workspace build against a peat-mesh missing
# `subscribe_to_changes_with_origin` — the load-bearing call.
#
# Floor advanced to rc.17 on 2026-05-22 (peat-mesh#152 + peat-mesh#154
# / defenseunicorns/peat#890) — rc.17 ships
# `peat_mesh::storage::interface_filter::select_advertise_interfaces`
# + the `BoundAddr` / `InterfaceSelection` types that
# `peat-protocol/src/network/iroh_transport.rs::from_seed_at_addr`
# now consumes to filter the iroh `Endpoint`'s advertised set when
# the caller passes an unspecified bind addr (`0.0.0.0` / `[::]`).
# Pinning below rc.17 would let the workspace build against a
# peat-mesh missing those exports — the load-bearing call site
# would fail to compile.
#
# Floor advanced to rc.18 on 2026-05-23 (peat-mesh#156 + peat-mesh#157
# / defenseunicorns/peat#918, ADR-062 Phase 1) — rc.18 hosts the
# canonical `IrohTransport` (moved from peat-protocol), the
# `peat_mesh::network::iroh_transport` module that
# `peat-protocol/src/network/iroh_transport.rs` re-exports from, and
# the `peat_mesh::network::peer_info::PeerInfo` struct that
# `peat-protocol/src/network/peer_config.rs` re-exports from.
# **Wire-breaking**: rc.18 derives deterministic-seed `IrohTransport`
# keys via HKDF-SHA-256 with v2 salt/info; rc.13 NodeIds are not
# reproducible under rc.18.
#
# Floor advanced to rc.20 on 2026-05-23 (peat-mesh#158 + peat-mesh#159
# + peat-mesh#160 / defenseunicorns/peat#923 + peat#924) — rc.19 first
# advanced iroh 0.97 → 0.98 with the new explicit `crypto_provider()`
# API, then rc.20 cut atop rc.19 to advance iroh further to
# `=1.0.0-rc.0` (and iroh-blobs 0.100 → 0.101) before this PR merged.
# rc.20 is therefore the smallest floor that exposes the 1.0 API
# surface peat-protocol now compiles against (`Endpoint::builder(presets::Empty)`,
# `iroh_mdns_address_lookup` extracted crate, the
# `PathInfo → Path<'a> + PathStats` split, etc.). Both rc.19 and rc.20
# wire `rustls::crypto::aws_lc_rs::default_provider()` as the active
# iroh QUIC crypto provider via `Endpoint::builder().crypto_provider()`
# (n0-computer/iroh#3978). ring is NOT FIPS 140-3 validated and is no
# longer the active provider for any iroh handshake the workspace
# initiates. Pinning below rc.20 would either (a) refuse to resolve
# (rc.19 has iroh 0.98 which is wire-incompatible with peat-protocol's
# `=1.0.0-rc.0` pin in this PR) or (b) at rc.19, miss the 1.0 API
# migration. Either outcome is a build break, not a silent regression
# — but rc.20 is the only floor that actually compiles.
#
# Floor advanced to rc.22 on 2026-05-25 (peat-mesh#162 + peat-mesh#166
# / peat#926, ADR-062 Phase 2) — rc.21 hosted the canonical
# `peat_mesh::transport::iroh_mesh::IrohMeshTransport` (the iroh-backed
# `MeshTransport` impl, moved from peat-protocol) and re-exported
# `iroh::EndpointId` from `peat_mesh::network`. rc.22 added the
# follow-up `Connection` + `DiscoveryEvent` re-exports the rc.21 surface
# missed: `peat_mesh::network::Connection` (consumed by
# `peat-protocol/src/network/formation_handshake.rs`) and
# `peat_mesh::network::DiscoveryEvent` (consumed by
# `peat-protocol/src/sync/automerge.rs`'s mDNS event handler).
# The peat-protocol consumer-side deletion of
# `peat-protocol/src/transport/iroh.rs` + the direct
# `iroh`/`iroh-blobs`/`iroh-mdns-address-lookup` dep drop both land in
# this PR; both depend on rc.22's full re-export surface. Pinning below
# rc.22 would either fail to resolve the
# `peat_mesh::transport::iroh_mesh::IrohMeshTransport` import (rc.20)
# or fail to resolve the `Connection`/`DiscoveryEvent` re-exports the
# consumer-side `use` statements now reach for (rc.21).
#
# Floor advanced to rc.24 on 2026-05-26 (peat-mesh#173 / peat#932) —
# rc.23 shipped the `parse_close_reason` structured-variant refactor
# (peat-mesh#164) which is internal to peat-mesh and required no
# consumer change. rc.24 introduces the narrow
# `peat_mesh::network::QuicMeshConnection` trait and **removes** the
# `pub use iroh::endpoint::Connection` re-export at
# `peat_mesh::network::Connection`. peat-protocol's
# `network/formation_handshake.rs` switches to `&dyn QuicMeshConnection`
# in this PR and drops `Connection` from `peat-protocol/src/network.rs`'s
# re-export list. Pinning below rc.24 would fail to resolve
# `QuicMeshConnection`; staying at rc.22/rc.23 would keep the old
# `Connection` import path alive but block the SKILL.md
# transport-agnosticism-at-API-shape gate this work closes.
peat-mesh = { version = ">=0.9.0-rc.24, <0.9.1", default-features = false }

# BLE mesh transport (ADR-039). `>=0.4.0, <0.4.1` matches peat-btle
# 0.4.0 — the Slice-4.b release that deleted the `mesh-translator`
# back-edge feature + optional `peat-mesh` dep. Same wire-shape
# protection at the patch line that the pre-Slice-4.b range pin
# maintained on the 0.3.4 line: any `0.4.x → 0.4.y` bump can carry
# a `translator-codec` byte-format change for a pre-1.0 crate, so
# the explicit `<0.4.1` upper bound is the deliberate gate.
# Resolution: crates.io directly (post-2026-05-12). The prior
# `[patch.crates-io]` git override that pinned both peat-mesh and
# peat-btle to specific commit revs during the Slice 4 rc-cycle is
# gone — both crates have post-Slice-4 releases on crates.io now.
peat-btle = ">=0.4.0, <0.4.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
