[package]
name = "peat-ffi"
# 0.2.0 (was 0.1.0): breaking JNI ABI rename — every
# `Java_com_defenseunicorns_atak_peat_PeatJni_*` extern fn renamed to
# `Java_com_defenseunicorns_peat_PeatJni_*` (103 sites), plus
# NativeMethod table classpath strings and callback class lookups.
# Pre-1.0 semver: minor bump signals the breaking change.
# This crate's version is independent of `workspace.package.version`
# so the wire-versioned ABI surface can rev separately from the
# workspace's CHANGELOG-tracked protocol cadence; see CHANGELOG
# entry under [0.9.0-rc.2] for the consumer migration contract.
#
# 0.2.4 (was 0.2.3): additive — two new `Java_..._PeatJni_*` extern
# fns for peat-mesh#138 M4 (endpointSocketAddrJni, getDocumentJni)
# + matching nativeInit / JNI_OnLoad table entries. Backward
# compatible; existing JNI consumers continue to link against the
# 0.2.3 surface unchanged. See peat#879.
#
# 0.2.5 (was 0.2.4): peat-ffi 0.1.2 patch release. Three additive
# changes:
#   - peat#887: env.exception_clear() after JNI_OnLoad find_class
#     fails for PeerEventManager. Without this, consumers that
#     don't ship the class crash at System.loadLibrary with SIGABRT.
#   - peat#886: ship canonical PeatJni.kt + PeerEventManager.kt in
#     the AAR. Consumers drop hand-rolled bindings and import from
#     com.defenseunicorns.peat.
#   - peat#885: forceStoreErrorForTestingJni for deterministic
#     test-side Err-branch coverage on getDocumentJni.
# All additive; no JNI ABI break. peat-atak-plugin and peat-mesh
# consumers continue to link against 0.2.3+ symbols unchanged.
version = "0.2.5"
edition = "2021"
description = "FFI bindings for Peat protocol (Kotlin/Swift via UniFFI)"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "peat_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[[example]]
name = "peat_cot_client"
path = "examples/peat_cot_client.rs"
required-features = ["sync"]

[[example]]
name = "iroh_test_peer"
path = "examples/iroh_test_peer.rs"
required-features = ["sync"]

[[example]]
name = "dual_test_peer"
path = "examples/dual_test_peer.rs"
required-features = ["sync", "bluetooth"]

[features]
default = ["sync"]
sync = ["peat-protocol/automerge-backend", "dep:peat-mesh", "peat-mesh/automerge-backend"]
# Bluetooth LE transport - BLE mesh networking (ADR-039)
# Enables peat-btle integration via TransportManager
bluetooth = ["peat-protocol/bluetooth", "dep:peat-btle"]
# Universal Document transport over peat-lite envelope (ADR-035 + ADR-059
# Slice 1.b "scope #3"). Pulls in peat-mesh's lite-bridge feature so the
# `LiteBridgeTranslator` is available for registration alongside the typed
# 0xB6 `BleTranslator`. Both translators register on the same physical
# wire (BLE) under distinct transport_ids ("ble" vs "ble-lite") so
# origin-skip can disambiguate echo-loops between them. The Kotlin AAR
# build enables this on Android; non-BLE consumers leave it off.
#
# **Hard-requires `bluetooth`.** Every concrete item this feature gates
# (`CollectionGatedLiteBridge`, `LITE_BRIDGE_COLLECTIONS`, the JNI
# subscribe additions) is `cfg(all(feature = "sync", feature = "bluetooth",
# feature = "lite-bridge"))`. Without `bluetooth`, the feature would
# enable `peat-mesh/lite-bridge` transitively but compile no wrapper, no
# allow-list, and no registration — a silent no-op. Listing `"bluetooth"`
# in the deps surfaces the requirement at the feature surface so a
# consumer that asks for `lite-bridge` actually gets the wiring.
# (Round-2 QA review on PR #841 flagged this as [WARNING].)
lite-bridge = ["sync", "bluetooth", "peat-mesh/lite-bridge"]

[dependencies]
# UniFFI for cross-language bindings (proc-macro only mode)
uniffi = { version = "0.28", features = ["cli", "tokio"] }

# JNI for direct Android native method binding (bypasses JNA symbol lookup issues)
jni = "0.21"

# Peat crates - no ditto-backend for Android cross-compilation
peat-protocol = { path = "../peat-protocol", default-features = false }
# peat-mesh direct for blob storage (ADR-060). Pulls NetworkedIrohBlobStore
# which we use behind the peat_mesh::storage::BlobStore trait.
peat-mesh = { workspace = true, optional = true }

# Time handling
chrono = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime for UniFFI async support
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# async-trait for OutboundSink impl bridging into Kotlin (ADR-059 Slice 1.b).
# Must be a direct dep so the trait + impl share the same proc-macro version.
async-trait = "0.1"

# JSON serialization for document data
serde_json = "1.0"

# Hex encoding for node IDs
hex = "0.4"

# Temporary directory for testing
tempfile = "3"

# Tracing: subscriber + env-filter so peat-mesh's internal
# `tracing::warn!`/`info!`/`debug!` events (e.g. per-document sync
# failures inside `sync_all_documents_with_peer` that previously
# returned Ok at the outer call while individual doc syncs silently
# failed) become visible on Android via the custom `android_log`-
# backed writer wired in `JNI_OnLoad`. peat#850. Gated to Android
# only — the iOS UniFFI binary doesn't need a logcat bridge and
# shouldn't carry tracing-subscriber's transitive footprint
# (`regex`, `sharded-slab`, etc.) for an Android-only call site.
# (`tracing` / `tracing-subscriber` entries live below in the
# `cfg(target_os = "android")` dependency table alongside
# `peat-btle`, since cargo rejects duplicate target sections.)

# BLE transport (optional, enabled by bluetooth feature)
# Platform-specific adapter selected via target cfg in dependencies below
peat-btle = { workspace = true, optional = true }

# Platform-specific BLE adapter features
[target.'cfg(target_os = "linux")'.dependencies]
peat-btle = { workspace = true, features = ["linux"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
peat-btle = { workspace = true, features = ["macos"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
peat-btle = { workspace = true, features = ["windows"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
peat-btle = { workspace = true, features = ["ios"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
peat-btle = { workspace = true, features = ["android"], optional = true }
# Android-only tracing bridge (see comment above the peat-btle target tables).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# peat#925 follow-on: `ndk-context` is pulled in transitively by the
# iroh 1.0.0-rc.0 cascade (swarm-discovery / iroh-mdns-address-lookup
# / iroh-dns) and panics with "android context was not initialized"
# the first time any Android-aware code in that subtree resolves the
# global context (mDNS multicast detection, NDK socket-option
# checks, etc.). Without an explicit `ndk_context::initialize_android_context`
# call in JNI_OnLoad, every `createNodeJni` call SIGABRT's mid-bind.
# We depend on it directly so we control the initialization order.
ndk-context = "0.1"

[dev-dependencies]
env_logger = "0.11"
# JVM-in-process integration tests (peat#881). The "invocation" feature
# enables `JavaVM::new(InitArgsBuilder...)` so the test can boot a real
# JVM and exercise the Java_..._PeatJni_* extern fns through the same
# JNIEnv consumers see at runtime. Runtime jni dep above stays
# feature-less; cargo unions the feature set for the test target.
jni = { version = "0.21", features = ["invocation"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
