# Peat Supply Chain Policy — cargo-deny configuration
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Advisory Database (RustSec) ---
[advisories]
# Fail the build on any known vulnerability
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; tracked for migration to rustls-pki-types" },
    # Transitive via iroh — cannot fix locally, tracked upstream
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained; transitive via iroh" },
    # Transitive via iroh -> aws-lc-sys
    { id = "RUSTSEC-2026-0044", reason = "aws-lc X.509 bypass; transitive via iroh, awaiting upstream update" },
    { id = "RUSTSEC-2026-0048", reason = "aws-lc CRL logic error; transitive via iroh, awaiting upstream update" },
    # RUSTSEC-2026-0118 / -0119 / -0120 — hickory-proto + hickory-net DNSSEC
    # NSEC3 unbounded loops and O(n²) name compression — were ignored prior
    # to peat#924 because iroh 0.98.x exact-pinned `hickory-resolver
    # =0.26.0-beta.4`, transitively pinning the vulnerable hickory
    # versions. peat#924 lands iroh 1.0.0-rc.0 which carries hickory-proto +
    # hickory-net at 0.26.1, the fixed releases. `cargo audit` against the
    # current Cargo.lock no longer surfaces any of the three — the ignores
    # are stale and intentionally removed so a future regression that
    # re-pins to a vulnerable hickory version is caught loudly instead of
    # silently suppressed. peat#924 QA WARNING follow-up.

    # Workspace crates
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; used in peat-ffi, evaluate migration to postcard" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; macro-only, low risk" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; compile-time only, low risk" },
    # quick-xml DoS (fixed in 0.41.0). peat-protocol's direct CoT-XML parser
    # (the network-reachable path on the Linux fleet) is migrated to quick-xml
    # 0.41 in this workspace, so that exposure is fixed. These ignores cover
    # ONLY the residual quick-xml 0.38.4 copy pulled via netwatch -> netdev ->
    # plist, which netdev gates behind cfg(macos/ios) — not compiled on Linux.
    # plist has no release accepting quick-xml >=0.40 (1.9.0 pins ^0.39.2).
    # MUST stay in sync with the cargo audit --ignore set in ci.yml; drop from
    # BOTH when plist accepts quick-xml >=0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic-runtime DoS; residual Apple-only copy via netdev -> plist (peat-protocol migrated to 0.41); no plist release allows quick-xml >=0.41 yet" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml namespace-allocation memory-exhaustion DoS; residual Apple-only copy via netdev -> plist (peat-protocol migrated to 0.41); no plist release allows quick-xml >=0.41 yet" },
]

# --- License Policy ---
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

# --- Crate Bans ---
[bans]
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"

# Workspace members are always allowed
allow-workspace = true

deny = [
    # No crates banned yet — add crates here that fail supply chain review
    # Example: { crate = "sketchy-crate", reason = "Failed supply chain audit" },
]

skip = []
skip-tree = []

# --- Source Policy ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Only allow git dependencies from these GitHub orgs
github = [
    "defenseunicorns",
    "nicobao",
]
